{% extends "base.html" %}

{% block title %}Forgot Password | Notes App{% endblock %}

{% block content %}
<section class="auth-layout">
    <div class="card">
        <div class="hero">
            <h1>Reset your password</h1>
            <p>Enter your registered email address and choose a new password.</p>
        </div>

        <form method="post">
            <label for="email">
                Email
                <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
            </label>

            <label for="new_password">
                New Password
                <input type="password" id="new_password" name="new_password" placeholder="Enter a new password" required>
            </label>

            <label for="confirm_password">
                Confirm Password
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your new password" required>
            </label>

            <div class="actions">
                <button class="button button-primary" type="submit">Update Password</button>
                <a class="button" href="{{ url_for('login') }}">Back to Login</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
