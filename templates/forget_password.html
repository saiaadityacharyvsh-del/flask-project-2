{% extends "base.html" %}

{% block title %}
Forgot Password | Notes App
{% endblock %}

{% block content %}

<section class="auth-layout">

    <div class="card">

        <div class="hero">
            <h1>Forgot Password</h1>

            <p>
                Enter your registered email address.
                We will send you a password reset link.
            </p>
        </div>

        <form method="POST">

            <label for="email">

                Email

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </label>

            <div class="actions">

                <button
                    class="button button-primary"
                    type="submit"
                >
                    Send Reset Link
                </button>

            </div>

        </form>

        <p style="margin-top: 18px;">

            Remember your password?

            <a
                class="muted-link"
                href="{{ url_for('login') }}"
            >
                Login here
            </a>

        </p>

    </div>

</section>

{% endblock %}
