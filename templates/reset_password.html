{% extends "base.html" %}

{% block title %}
Reset Password | Notes App
{% endblock %}

{% block content %}

<section class="auth-layout">

    <div class="card">

        <div class="hero">

            <h1>Reset Password</h1>

            <p>
                Enter your new password below.
            </p>

        </div>

        <form method="POST">

            <label for="new_password">

                New Password

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                >

            </label>

            <label for="confirm_password">

                Confirm Password

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >

            </label>

            <div class="actions">

                <button
                    class="button button-primary"
                    type="submit"
                >
                    Reset Password
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
